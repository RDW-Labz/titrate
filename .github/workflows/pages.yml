name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4   # version comes from packageManager
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # 24+ strips types, so `pnpm test` runs the .mts selfcheck
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # the app is served from /titrate; basePath cannot use an absolute env name, so pass both
      - run: pnpm build
        env:
          PAGES_BASE_PATH: /titrate
          NEXT_PUBLIC_BASE_PATH: /titrate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
